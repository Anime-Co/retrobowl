<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e2a17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket Gridiron">
  <meta name="description" content="A retro arcade football game with franchise management. Play in any browser on phone or desktop.">
  <title>Pocket Gridiron</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="stage" hidden>
      <canvas id="game" aria-label="Football field"></canvas>
      <div id="hud"></div>
    </div>
    <div id="ui"></div>
  </div>
  <noscript><p class="noscript">Pocket Gridiron needs JavaScript enabled.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
